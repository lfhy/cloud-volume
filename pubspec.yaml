name: remote_storage
description: "Flutter desktop shell for S3-compatible remote storage management."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.4
  path: ^1.9.1
  shadcn_ui: ^0.54.0
  shared_preferences: ^2.5.5
  file_picker: ^12.0.0
  file_selector: ^1.0.3
  flutter_markdown_plus: ^1.0.12
  flutter_svg: ^2.2.1
  http: ^1.2.2
  path_provider: ^2.1.4
  url_launcher: ^6.3.2
  desktop_multi_window: ^0.3.0
  window_manager: ^0.5.1
  super_drag_and_drop: ^0.9.1
  super_clipboard: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Keep CargoKit-based native code out of Android's Gradle build while retaining
# the upstream Windows/macOS/Linux implementations used by the desktop shell.
dependency_overrides:
  super_native_extensions:
    path: third_party/super_native_extensions
  irondash_engine_context:
    path: third_party/irondash_engine_context

flutter:
  uses-material-design: true
  fonts:
    - family: SourceHanSansCN
      fonts:
        - asset: assets/fonts/SourceHanSansCN-Bold.otf
          weight: 400
        - asset: assets/fonts/SourceHanSansCN-Bold.otf
          weight: 500
        - asset: assets/fonts/SourceHanSansCN-Bold.otf
          weight: 600
        - asset: assets/fonts/SourceHanSansCN-Bold.otf
          weight: 700
  assets:
    - assets/brand/
    - assets/fonts/
    - assets/icons/local_cloudpan/fileType/
    - assets/icons/local_cloudpan/fileType/audio/
    - assets/icons/local_cloudpan/fileType/compression/
    - assets/icons/local_cloudpan/fileType/document/
    - assets/icons/local_cloudpan/fileType/picture/
    - assets/icons/local_cloudpan/fileType/video/
    - assets/icons/local_cloudpan/sidebar/
    - assets/icons/fluent/
    - assets/icons/whitesur/places/
    - assets/icons/whitesur/mimes/
    - assets/icons/whitesur/source/
