# Builds the tagged desktop release matrix and publishes the release assets.
name: release-desktop

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  cli:
    name: cli-${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: lite
            goos: linux
            goarch: amd64
          - variant: lite
            goos: linux
            goarch: arm64
          - variant: lite
            goos: darwin
            goarch: amd64
          - variant: lite
            goos: darwin
            goarch: arm64
          - variant: lite
            goos: windows
            goarch: amd64
          - variant: full
            goos: linux
            goarch: amd64
          - variant: full
            goos: linux
            goarch: arm64
          - variant: full
            goos: darwin
            goarch: amd64
          - variant: full
            goos: darwin
            goarch: arm64
          - variant: full
            goos: windows
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Mark scripts executable
        run: chmod +x scripts/*.sh

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Flutter
        if: ${{ matrix.variant == 'full' }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install CLI packaging helpers
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build CLI release assets
        env:
          VERSION_NAME: ${{ github.ref_name }}
        run: |
          ./scripts/build_cli_packages.sh \
            --goos "${{ matrix.goos }}" \
            --goarch "${{ matrix.goarch }}" \
            --variant "${{ matrix.variant }}" \
            --version "${VERSION_NAME#v}" \
            --output-dir dist/cli

      - name: Upload CLI assets
        uses: actions/upload-artifact@v4
        with:
          name: yunjuan-cli-${{ matrix.variant }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/cli/*
          if-no-files-found: error

  macos:
    name: macos-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: universal
            runner: macos-14
          - arch: arm64
            runner: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Mark scripts executable
        run: chmod +x scripts/*.sh

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Build macOS release assets
        env:
          VERSION_NAME: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          flutter pub get
          ./scripts/build_desktop_packages.sh \
            --platform macos \
            --arch "${{ matrix.arch }}" \
            --version "${VERSION_NAME#v}" \
            --build-number "$BUILD_NUMBER" \
            --output-dir dist/macos-${{ matrix.arch }}

      - name: Upload macOS assets
        uses: actions/upload-artifact@v4
        with:
          name: yunjuan-macos-${{ matrix.arch }}
          path: dist/macos-${{ matrix.arch }}/*
          if-no-files-found: error

  windows:
    name: windows-amd64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Mark scripts executable
        run: chmod +x scripts/*.sh

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Windows amd64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc

      - name: Resolve Windows GCC path
        shell: pwsh
        run: |
          $gccPath = (Get-Command gcc -ErrorAction Stop).Source
          $gxxPath = (Get-Command g++ -ErrorAction Stop).Source
          "BRIDGE_CC=$gccPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BRIDGE_CXX=$gxxPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows release assets
        env:
          VERSION_NAME: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          flutter pub get
          ./scripts/build_desktop_packages.sh \
            --platform windows \
            --arch amd64 \
            --version "${VERSION_NAME#v}" \
            --build-number "$BUILD_NUMBER" \
            --output-dir dist/windows-amd64

      - name: Upload Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: yunjuan-windows-amd64
          path: dist/windows-amd64/*
          if-no-files-found: error

  web:
    name: web-linux-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Mark scripts executable
        run: chmod +x scripts/*.sh

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build Web release assets
        env:
          VERSION_NAME: ${{ github.ref_name }}
        run: |
          ./scripts/build_web_release.sh \
            --goarch "${{ matrix.goarch }}" \
            --version "${VERSION_NAME#v}" \
            --output-dir dist/web

      - name: Upload Web assets
        uses: actions/upload-artifact@v4
        with:
          name: yunjuan-web-linux-${{ matrix.goarch }}
          path: dist/web/*
          if-no-files-found: error

  linux:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Mark scripts executable
        run: chmod +x scripts/*.sh

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libgtk-3-dev \
            liblzma-dev \
            ninja-build \
            pkg-config

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Build Linux release assets
        env:
          VERSION_NAME: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          flutter pub get
          ./scripts/build_desktop_packages.sh \
            --platform linux \
            --arch "${{ matrix.arch }}" \
            --version "${VERSION_NAME#v}" \
            --build-number "$BUILD_NUMBER" \
            --output-dir dist/linux-${{ matrix.arch }}

      - name: Upload Linux assets
        uses: actions/upload-artifact@v4
        with:
          name: yunjuan-linux-${{ matrix.arch }}
          path: dist/linux-${{ matrix.arch }}/*
          if-no-files-found: error

  android:
    name: android-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Mark scripts executable
        run: chmod +x scripts/*.sh

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Flutter for Android
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Build signed Android ARM64 release asset
        env:
          VERSION_NAME: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for secret_var in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_var:-}" ]]; then
              printf 'Error: missing required repository secret %s.\n' "$secret_var" >&2
              exit 1
            fi
          done
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/yunjuan-release.keystore"
          umask 077
          trap 'rm -f "$ANDROID_KEYSTORE_FILE"' EXIT
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"; then
            printf 'Error: ANDROID_KEYSTORE_BASE64 is not valid base64.\n' >&2
            exit 1
          fi
          unset ANDROID_KEYSTORE_BASE64
          [[ -s "$ANDROID_KEYSTORE_FILE" ]] || { printf 'Error: decoded Android keystore is empty.\n' >&2; exit 1; }
          ./scripts/build_android_packages.sh \
            --version "${VERSION_NAME#v}" \
            --build-number "$BUILD_NUMBER" \
            --sdk-root "$ANDROID_SDK_ROOT" \
            --output-dir dist/android-arm64

      - name: Upload Android asset
        uses: actions/upload-artifact@v4
        with:
          name: yunjuan-android-arm64
          path: dist/android-arm64/yunjuan-android-arm64-v*.apk
          if-no-files-found: error

  publish:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && always() && needs.android.result == 'success' }}
    name: publish
    runs-on: ubuntu-latest
    needs:
      - cli
      - web
      - macos
      - windows
      - linux
      - android
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Mark scripts executable
        run: chmod +x scripts/*.sh

      - name: Prepare release staging directory
        run: mkdir -p dist/release

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true

      - name: Verify staged release assets
        run: |
          asset_count="$(find dist/release -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [[ "$asset_count" == "0" ]]; then
            printf 'Error: no packaged artifacts were produced by upstream jobs.\n' >&2
            exit 1
          fi
          printf 'Staged %s release asset(s).\n' "$asset_count"

      - name: Generate release body
        env:
          TARGET_TAG: ${{ github.ref_name }}
          ASSET_DIR: dist/release
          OUTPUT_FILE: dist/release-body.md
        run: ./scripts/generate_release_body.sh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 云卷 ${{ github.ref_name }}
          body_path: dist/release-body.md
          files: dist/release/*
          fail_on_unmatched_files: true
